<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A+M Recipe Box</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23d63230'/><text x='50' y='64' font-family='Arial' font-weight='700' font-size='40' fill='white' text-anchor='middle'>A+M</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bump ?v= when these files change so phones don't keep an old copy. -->
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header class="top">
    <a href="#/" class="brand">A+M Recipe Box</a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-route="home">Recipes</a>
      <a href="#/cart" data-route="cart">Cart <span id="cart-count" class="nav-count"></span></a>
      <a href="#/pantry" data-route="pantry">Pantry</a>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <button type="button" id="fish" class="fish-btn" aria-label="A little fish"></button>
  </footer>

  <template id="home-tpl">
    <section class="hero">
      <h1>Our Recipes</h1>
      <form id="add-form" class="add" autocomplete="off">
        <input id="url" type="url" inputmode="url" placeholder="Paste a recipe link" required aria-label="Recipe link">
        <button type="submit" class="btn">Add recipe</button>
      </form>
      <div id="add-status" class="status" role="status"></div>
      <p class="or"><a href="#/new">or type one in yourself</a></p>
    </section>

    <div class="filters">
      <div class="tabs" role="tablist" aria-label="Filter recipes">
        <button type="button" class="tab" data-filter="all" role="tab">All <span class="count"></span></button>
        <button type="button" class="tab" data-filter="todo" role="tab">To try <span class="count"></span></button>
        <button type="button" class="tab" data-filter="made" role="tab">Made it <span class="count"></span></button>
      </div>
      <input id="search" class="box" type="search" placeholder="Search recipes" aria-label="Search recipes">
      <select id="sort" class="box" aria-label="Sort recipes">
        <option value="new">Newest</option>
        <option value="rating">Top rated</option>
        <option value="name">A–Z</option>
      </select>
      <button type="button" id="pick" class="box pick-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg>
        Pick for me
      </button>
    </div>

    <div id="grid" class="grid"></div>
  </template>

  <template id="blocked-tpl">
    <div class="blocked">
      <p>Use the bookmark button instead. Tap it while you're on the recipe page and it'll land here.</p>
      <ol>
        <li><strong>Computer:</strong> drag this to your bookmarks bar: <a class="bm-button" href="#">Save to Recipe Box</a></li>
        <li><strong>Phone:</strong> bookmark any page, edit it, and paste this as the address: <button type="button" class="bm-copy small">Copy code</button></li>
      </ol>
    </div>
  </template>

  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
